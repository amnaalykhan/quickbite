<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#ff6b35"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="QuickBite Staff"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>QuickBite Staff</title>
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&display=swap');
:root {
  --bg:#0a0f1e; --surface:#111827; --surface2:#1a2235; --border:#1e2d45;
  --orange:#ff6b35; --orange-dim:rgba(255,107,53,.15); --orange-glow:rgba(255,107,53,.3);
  --green:#10b981; --green-dim:rgba(16,185,129,.15);
  --yellow:#f59e0b; --yellow-dim:rgba(245,158,11,.15);
  --red:#ef4444; --red-dim:rgba(239,68,68,.15);
  --text:#f1f5f9; --text2:#94a3b8; --text3:#475569;
  --font:'Space Grotesk',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--text);}

/* ── LOGIN ── */
.login-screen{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.login-logo{font-size:56px;margin-bottom:8px;}
.login-title{font-size:26px;font-weight:800;margin-bottom:4px;}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:32px;text-align:center;}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;max-width:360px;}
.login-tabs{display:flex;margin-bottom:20px;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.ltab{flex:1;padding:10px;font-size:13px;font-weight:700;text-align:center;cursor:pointer;color:var(--text2);background:transparent;border:none;font-family:var(--font);}
.ltab.active{background:var(--orange);color:#fff;}
.form-label{font-size:11px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px;}
.form-input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:10px;font-size:15px;font-family:var(--font);margin-bottom:14px;outline:none;}
.form-input:focus{border-color:var(--orange);}
.btn-primary{width:100%;background:var(--orange);color:#fff;border:none;padding:14px;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;font-family:var(--font);}
.btn-primary:active{opacity:.85;}
.login-error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#ef4444;border-radius:8px;padding:10px;font-size:12px;margin-bottom:12px;display:none;text-align:center;}

/* ── MAIN APP ── */
.app{display:none;flex-direction:column;height:100%;}
.app.visible{display:flex;}

/* TOPBAR */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;padding-top:max(12px,env(safe-area-inset-top));}
.topbar-left{display:flex;flex-direction:column;}
.app-title{font-size:18px;font-weight:800;color:var(--orange);}
.rest-name{font-size:11px;color:var(--text2);}
.topbar-right{display:flex;align-items:center;gap:8px;}
.live-dot-wrap{display:flex;align-items:center;gap:5px;background:var(--green-dim);border:1px solid rgba(16,185,129,.4);padding:4px 10px;border-radius:20px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.live-txt{font-size:11px;font-weight:700;color:var(--green);}
.logout-btn{background:var(--red-dim);border:1px solid rgba(239,68,68,.3);color:var(--red);padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;}

/* TABS */
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.tab{flex:1;padding:12px 4px;text-align:center;font-size:12px;font-weight:700;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;position:relative;}
.tab.active{color:var(--orange);border-bottom-color:var(--orange);}
.tab-badge{position:absolute;top:6px;right:calc(50% - 22px);background:var(--orange);color:#fff;font-size:10px;font-weight:800;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.tab-badge.hidden{display:none;}

/* ORDERS LIST */
.orders-wrap{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;padding-bottom:20px;}
.orders-wrap::-webkit-scrollbar{display:none;}

/* ORDER CARD */
.ocard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;position:relative;overflow:hidden;animation:cardIn .25s ease;}
@keyframes cardIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.ocard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;}
.ocard.new::before{background:var(--orange);}
.ocard.preparing::before{background:var(--yellow);}
.ocard.done{opacity:.6;}
.ocard.done::before{background:var(--green);}
.ocard-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.ocard-table{font-size:22px;font-weight:800;}
.ocard-time{font-size:11px;color:var(--text3);}
.ocard-items{margin-bottom:12px;display:flex;flex-direction:column;gap:4px;}
.ocard-item{font-size:13px;color:var(--text2);display:flex;justify-content:space-between;}
.ocard-item-name{display:flex;gap:6px;align-items:center;}
.qty{background:var(--orange-dim);color:var(--orange);font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;}
.ocard-note{background:var(--yellow-dim);border:1px solid rgba(245,158,11,.25);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--yellow);margin-bottom:10px;}
.ocard-footer{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.ocard-total{font-size:17px;font-weight:800;}
.ocard-btns{display:flex;gap:6px;}
.action-btn{padding:10px 14px;border-radius:10px;border:none;font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;transition:all .12s;}
.action-btn:active{transform:scale(.95);}
.btn-prep{background:var(--yellow-dim);color:var(--yellow);border:1px solid rgba(245,158,11,.3);}
.btn-done{background:var(--green-dim);color:var(--green);border:1px solid rgba(16,185,129,.3);}
.btn-del{background:var(--red-dim);color:var(--red);border:1px solid rgba(239,68,68,.3);}

/* EMPTY */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text3);padding:40px;}
.empty-icon{font-size:48px;opacity:.4;}
.empty-msg{font-size:14px;font-weight:600;}

/* FLASH */
.flash{position:fixed;top:0;left:0;right:0;z-index:999;background:var(--orange);color:#fff;padding:16px;text-align:center;font-weight:800;font-size:14px;transform:translateY(-100%);transition:transform .3s ease;padding-top:max(16px,env(safe-area-inset-top));}
.flash.show{transform:translateY(0);}

/* STATS BAR */
.stats-bar{background:var(--surface);border-top:1px solid var(--border);display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);}
.stat{flex:1;padding:10px 8px;text-align:center;border-right:1px solid var(--border);}
.stat:last-child{border-right:none;}
.stat-val{font-size:18px;font-weight:800;}
.stat-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-top:1px;}

/* INSTALL BANNER */
.install-banner{background:var(--orange-dim);border:1px solid var(--orange-glow);border-radius:12px;padding:12px 14px;margin:10px 12px 0;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.install-banner-text{flex:1;font-size:12px;color:var(--text2);line-height:1.4;}
.install-banner-text strong{color:var(--text);display:block;margin-bottom:2px;}
.install-close{color:var(--text3);font-size:18px;cursor:pointer;padding:0 4px;}
</style>
</head>
<body>

<!-- FLASH -->
<div class="flash" id="flash"></div>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-logo">🍽</div>
  <div class="login-title">QuickBite Staff</div>
  <div class="login-sub">Sign in to manage your restaurant orders</div>
  <div class="login-box">
    <div class="login-tabs">
      <button class="ltab active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
      <button class="ltab" id="tabRegister" onclick="switchTab('register')">New Restaurant</button>
    </div>
    <div class="login-error" id="loginError"></div>

    <div id="formLogin">
      <label class="form-label">Email</label>
      <input class="form-input" id="l-email" type="email" placeholder="you@restaurant.com"/>
      <label class="form-label">Password</label>
      <input class="form-input" id="l-pass" type="password" placeholder="••••••••"/>
      <button class="btn-primary" onclick="doLogin()">Sign In →</button>
    </div>

    <div id="formRegister" style="display:none">
      <label class="form-label">Restaurant Name</label>
      <input class="form-input" id="r-name" placeholder="e.g. Spice Garden"/>
      <label class="form-label">Email</label>
      <input class="form-input" id="r-email" type="email" placeholder="you@restaurant.com"/>
      <label class="form-label">Password</label>
      <input class="form-input" id="r-pass" type="password" placeholder="Min 6 characters"/>
      <button class="btn-primary" onclick="doRegister()">Create Account →</button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div class="app" id="app">
  <!-- Install banner (shown on first load) -->
  <div class="install-banner" id="installBanner" style="display:none">
    <div style="font-size:24px">📲</div>
    <div class="install-banner-text">
      <strong>Install as app</strong>
      iPhone: tap Share → "Add to Home Screen" &nbsp;|&nbsp; Android: tap ⋮ → "Add to Home Screen"
    </div>
    <div class="install-close" onclick="dismissInstall()">×</div>
  </div>

  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="app-title">🍽 QuickBite</div>
      <div class="rest-name" id="restName">Loading…</div>
    </div>
    <div class="topbar-right">
      <div class="live-dot-wrap"><div class="live-dot"></div><span class="live-txt">LIVE</span></div>
      <div class="logout-btn" onclick="logout()">⏏</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" id="tab-new" onclick="switchOrderTab('new')">
      🔴 New <span class="tab-badge hidden" id="badge-new"></span>
    </div>
    <div class="tab" id="tab-preparing" onclick="switchOrderTab('preparing')">
      🟡 Preparing <span class="tab-badge hidden" id="badge-preparing"></span>
    </div>
    <div class="tab" id="tab-done" onclick="switchOrderTab('done')">
      🟢 Done
    </div>
  </div>

  <!-- Orders list -->
  <div class="orders-wrap" id="ordersList"></div>

  <!-- Stats bar -->
  <div class="stats-bar">
    <div class="stat"><div class="stat-val" id="s-new">0</div><div class="stat-label">New</div></div>
    <div class="stat"><div class="stat-val" id="s-preparing">0</div><div class="stat-label">Cooking</div></div>
    <div class="stat"><div class="stat-val" id="s-done">0</div><div class="stat-label">Done</div></div>
    <div class="stat"><div class="stat-val" id="s-revenue">0</div><div class="stat-label">Revenue</div></div>
  </div>
</div>

<script>
const API = 'https://quickbite-2-m1sd.onrender.com';
let TENANT_ID = localStorage.getItem('qb_tenant_id');
let RESTAURANT_NAME = localStorage.getItem('qb_rest_name') || '';
let currency = '₹';
let orders = [];
let activeTab = 'new';
let socket;

// ── HELPERS ──────────────────────────────────────────────────────────────────
function apiFetch(path, opts = {}) {
  const sep = path.includes('?') ? '&' : '?';
  return fetch(`${API}${path}${sep}rid=${TENANT_ID}`, opts);
}

function showFlash(msg, dur = 3000) {
  const el = document.getElementById('flash');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1100].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.2);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.2 + 0.2);
      osc.start(ctx.currentTime + i * 0.2);
      osc.stop(ctx.currentTime + i * 0.2 + 0.2);
    });
  } catch(e) {}
}

function timeAgo(dateStr) {
  const diff = Math.floor((Date.now() - new Date(dateStr)) / 60000);
  if (diff < 1) return 'just now';
  if (diff === 1) return '1 min ago';
  return `${diff} mins ago`;
}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function switchTab(tab) {
  document.getElementById('formLogin').style.display = tab === 'login' ? '' : 'none';
  document.getElementById('formRegister').style.display = tab === 'register' ? '' : 'none';
  document.getElementById('tabLogin').className = 'ltab' + (tab === 'login' ? ' active' : '');
  document.getElementById('tabRegister').className = 'ltab' + (tab === 'register' ? ' active' : '');
  document.getElementById('loginError').style.display = 'none';
}

function showLoginError(msg) {
  const el = document.getElementById('loginError');
  el.textContent = msg;
  el.style.display = 'block';
}

async function doLogin() {
  const email = document.getElementById('l-email').value.trim();
  const password = document.getElementById('l-pass').value;
  if (!email || !password) return showLoginError('Enter your email and password');
  try {
    const res = await fetch(`${API}/api/auth/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) return showLoginError(data.error || 'Login failed');
    onAuth(data);
  } catch(e) { showLoginError('Cannot reach server. Check your connection.'); }
}

async function doRegister() {
  const name = document.getElementById('r-name').value.trim();
  const email = document.getElementById('r-email').value.trim();
  const password = document.getElementById('r-pass').value;
  if (!name || !email || !password) return showLoginError('All fields are required');
  if (password.length < 6) return showLoginError('Password must be at least 6 characters');
  try {
    const res = await fetch(`${API}/api/auth/register`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, restaurant_name: name })
    });
    const data = await res.json();
    if (!res.ok) return showLoginError(data.error || 'Registration failed');
    onAuth(data);
  } catch(e) { showLoginError('Cannot reach server. Check your connection.'); }
}

function onAuth(data) {
  TENANT_ID = data.tenant_id;
  RESTAURANT_NAME = data.restaurant_name;
  localStorage.setItem('qb_tenant_id', TENANT_ID);
  localStorage.setItem('qb_rest_name', RESTAURANT_NAME);
  startApp();
}

function logout() {
  if (!confirm('Sign out of QuickBite?')) return;
  localStorage.removeItem('qb_tenant_id');
  localStorage.removeItem('qb_rest_name');
  location.reload();
}

// ── SOCKET ────────────────────────────────────────────────────────────────────
function connectSocket() {
  socket = io(API, { transports: ['websocket', 'polling'] });
  socket.on('connect', () => {
    socket.emit('join-restaurant', TENANT_ID);
  });
  socket.on('new-order', order => {
    orders.unshift(order);
    renderOrders();
    updateStats();
    showFlash(`🔔 New order — Table ${order.table_number}`);
    playBeep();
    // Switch to new tab
    switchOrderTab('new');
  });
  socket.on('order-updated', ({ id, status }) => {
    const o = orders.find(o => o.id === id);
    if (o) { o.status = status; renderOrders(); updateStats(); }
  });
  socket.on('order-deleted', ({ id }) => {
    orders = orders.filter(o => o.id !== id);
    renderOrders(); updateStats();
  });
}

// ── ORDERS ────────────────────────────────────────────────────────────────────
async function loadOrders() {
  try {
    const res = await apiFetch('/api/orders');
    orders = await res.json();
    renderOrders();
    updateStats();
  } catch(e) {}
}

function switchOrderTab(tab) {
  activeTab = tab;
  ['new','preparing','done'].forEach(t => {
    document.getElementById(`tab-${t}`).className = 'tab' + (t === tab ? ' active' : '');
  });
  renderOrders();
}

function renderOrders() {
  const filtered = orders.filter(o => o.status === activeTab);
  const list = document.getElementById('ordersList');

  // Update badges
  ['new','preparing'].forEach(t => {
    const count = orders.filter(o => o.status === t).length;
    const badge = document.getElementById(`badge-${t}`);
    badge.textContent = count;
    badge.className = count > 0 ? 'tab-badge' : 'tab-badge hidden';
  });

  if (!filtered.length) {
    const msgs = { new: 'No new orders', preparing: 'Nothing in the kitchen', done: 'No completed orders yet' };
    list.innerHTML = `<div class="empty"><div class="empty-icon">${activeTab === 'new' ? '🛎' : activeTab === 'preparing' ? '👨‍🍳' : '✅'}</div><div class="empty-msg">${msgs[activeTab]}</div></div>`;
    return;
  }

  list.innerHTML = filtered.map(o => `
    <div class="ocard ${o.status}" id="ocard-${o.id}">
      <div class="ocard-header">
        <div class="ocard-table">Table ${o.table_number}</div>
        <div class="ocard-time">#${o.id} · ${timeAgo(o.created_at)}</div>
      </div>
      <div class="ocard-items">
        ${(o.items || []).map(i => `
          <div class="ocard-item">
            <div class="ocard-item-name"><span class="qty">${i.quantity}×</span>${i.name}</div>
            <div style="color:var(--text3);font-size:12px">${currency}${(i.price * i.quantity).toFixed(0)}</div>
          </div>`).join('')}
      </div>
      ${o.customer_note || o.note ? `<div class="ocard-note">📝 ${o.customer_note || o.note}</div>` : ''}
      <div class="ocard-footer">
        <div class="ocard-total">${currency}${(o.total || 0).toFixed(0)}</div>
        <div class="ocard-btns">${actionBtns(o)}</div>
      </div>
    </div>`).join('');
}

function actionBtns(o) {
  if (o.status === 'new') return `
    <button class="action-btn btn-prep" onclick="updateStatus(${o.id},'preparing')">👨‍🍳 Preparing</button>
    <button class="action-btn btn-del" onclick="deleteOrder(${o.id})">✕</button>`;
  if (o.status === 'preparing') return `
    <button class="action-btn btn-done" onclick="updateStatus(${o.id},'done')">✅ Done</button>
    <button class="action-btn btn-del" onclick="deleteOrder(${o.id})">✕</button>`;
  return `<button class="action-btn btn-del" onclick="deleteOrder(${o.id})">🗑 Remove</button>`;
}

async function updateStatus(id, status) {
  try {
    await apiFetch(`/api/orders/${id}/status`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status })
    });
    const o = orders.find(o => o.id === id);
    if (o) {
      o.status = status;
      // Auto-switch tab to follow the order
      switchOrderTab(status);
      updateStats();
      showFlash(status === 'preparing' ? `👨‍🍳 Table ${o.table_number} — Preparing` : `✅ Table ${o.table_number} — Done!`);
    }
  } catch(e) { showFlash('Failed to update order'); }
}

async function deleteOrder(id) {
  if (!confirm('Remove this order?')) return;
  try {
    await apiFetch(`/api/orders/${id}`, { method: 'DELETE' });
    orders = orders.filter(o => o.id !== id);
    renderOrders(); updateStats();
  } catch(e) { showFlash('Failed to delete order'); }
}

function updateStats() {
  const newC = orders.filter(o => o.status === 'new').length;
  const prepC = orders.filter(o => o.status === 'preparing').length;
  const doneC = orders.filter(o => o.status === 'done').length;
  const rev = orders.filter(o => o.status === 'done').reduce((s, o) => s + (o.total || 0), 0);
  document.getElementById('s-new').textContent = newC;
  document.getElementById('s-preparing').textContent = prepC;
  document.getElementById('s-done').textContent = doneC;
  document.getElementById('s-revenue').textContent = `${currency}${rev.toFixed(0)}`;
}

// ── START ─────────────────────────────────────────────────────────────────────
function startApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  document.getElementById('restName').textContent = RESTAURANT_NAME;

  // Show install banner if not already dismissed and not in standalone
  if (!localStorage.getItem('qb_install_dismissed') && !window.navigator.standalone) {
    document.getElementById('installBanner').style.display = 'flex';
  }

  // Load settings for currency
  apiFetch('/api/settings').then(r => r.json()).then(s => {
    currency = s?.currency || '₹';
    updateStats();
  }).catch(() => {});

  connectSocket();
  loadOrders();

  // Refresh every 30 seconds as fallback
  setInterval(loadOrders, 30000);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
function dismissInstall() {
  localStorage.setItem('qb_install_dismissed', '1');
  document.getElementById('installBanner').style.display = 'none';
}

if (TENANT_ID) {
  startApp();
} else {
  document.getElementById('loginScreen').style.display = 'flex';
}
</script>
</body>
</html>
